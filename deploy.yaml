apiVersion: apps/v1
kind: Deployment
metadata:
  name: gratuity-app
  labels:
    app: gratuity-app
    app.kubernetes.io/name: gratuity-app
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gratuity-app
  template:
    metadata:
      labels:
        app: gratuity-app
    spec:
      containers:
        - name: gratuity-app
          image: gratuity-app:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gratuity-app
  labels:
    app: gratuity-app
spec:
  selector:
    app: gratuity-app
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gratuity-app
  labels:
    app: gratuity-app
spec:
  to:
    kind: Service
    name: gratuity-app
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
